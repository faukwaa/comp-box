<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<link rel="icon" type="image/png" href="emblem-64.png">
<link rel="apple-touch-icon" href="emblem-180.png">
<title>阵容码盒</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --ink:#1c1c1e; --sub:#8e8e93;
    --accent:#d9a441; --accent-ink:#7a5c14; --line:rgba(60,60,67,.08);
    --red:#ff3b30; --sel-bg:#e9e9eb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0}
  html{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    font-size:16px; line-height:1.45;
    padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 130px);
    max-width:640px; margin:0 auto; min-height:100%;
  }
  /* ---------- 顶栏 ---------- */
  header{
    display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 6px;
    position:sticky; top:0; z-index:5; background:rgba(242,242,247,.92);
    -webkit-backdrop-filter:blur(18px) saturate(180%); backdrop-filter:blur(18px) saturate(180%);
  }
  header img{width:32px; height:32px; border-radius:8px}
  h1{font-size:24px; font-weight:800; letter-spacing:-.02em}
  #count{color:var(--sub); font-size:12px; font-weight:500; margin-left:-2px}
  #header-right{margin-left:auto; display:flex; align-items:center; gap:6px}
  .text-btn{
    border:none; background:transparent; font-size:16px; font-weight:500;
    color:var(--ink); padding:6px 10px; cursor:pointer; border-radius:8px;
    -webkit-touch-callout:none;
  }
  .text-btn:active{background:var(--sel-bg)}
  .text-btn.primary{font-weight:600}
  /* 同步按钮 */
  #sync-btn{display:block; font-size:17px; padding:6px 8px; color:var(--sub)}
  #sync-btn.ok{color:#30b158}
  #sync-btn.err{color:var(--red)}
  #sync-btn.syncing{color:var(--sub)}
  #sync-btn.syncing svg{animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){#sync-btn.syncing svg{animation:none}}
  /* ---------- 搜索 & 赛季 ---------- */
  .search-wrap{position:relative; margin:8px 16px 0}
  #search{
    display:block; width:100%; box-sizing:border-box;
    padding:11px 42px 11px 16px; border:none; border-radius:12px;
    background:#e4e4e9; color:var(--ink); font-size:16px; outline:none;
    -webkit-appearance:none; appearance:none;
  }
  #search-clear{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:24px; height:24px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(120,120,128,.28); color:#3c3c43;
    font-size:11px; padding:0; display:flex; align-items:center; justify-content:center;
  }
  #search-clear[hidden]{display:none}
  #search-clear:active{background:rgba(120,120,128,.5)}
  #search::placeholder{color:#98989f}
  .chips{display:flex; gap:8px; padding:10px 16px 2px; overflow-x:auto; scrollbar-width:none}
  .chips[hidden]{display:none}
  .chips::-webkit-scrollbar{display:none}
  #tag-chips{padding-top:6px}
  /* 标签折叠开关 */
  .tag-toggle{
    display:flex; align-items:center; gap:5px; margin:4px 16px 0;
    background:none; border:none; color:var(--sub); font-size:13px; font-weight:600;
    padding:6px 4px; cursor:pointer;
  }
  .tag-toggle:active{opacity:.6}
  .tag-toggle.on{color:var(--accent-ink)}
  .tag-toggle .tag-arrow{font-size:10px; transition:transform .18s}
  .tag-toggle.open .tag-arrow{transform:rotate(180deg)}
  .chip{
    border:none; border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600;
    background:#e4e4e9; color:var(--sub); white-space:nowrap; cursor:pointer; flex-shrink:0;
    transition:background .15s, color .15s;
  }
  .chip.on{background:var(--ink); color:#fff}
  .chip.tag-chip{background:rgba(217,164,65,.18); color:var(--accent-ink)}
  .chip.tag-chip.on{background:var(--ink); color:#fff}
  /* ---------- 列表 ---------- */
  #list{list-style:none; margin:10px 0 0; padding:0 16px}
  .item{
    background:var(--card); border-radius:14px; margin-bottom:8px;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
    position:relative; overflow:hidden;
  }
  /* 左滑露出的操作(编辑/删除,在内容下层,右缘) */
  .swipe-bg{position:absolute; top:0; right:0; bottom:0; width:168px; display:flex}
  .swipe-del, .swipe-edit{
    width:50%; border:none; color:#fff; font-size:14px; font-weight:600; cursor:pointer;
  }
  .swipe-del{background:var(--red)}
  .swipe-edit{background:#767680}
  .swipe-content{
    position:relative; display:flex; align-items:center; gap:12px;
    background:var(--card); touch-action:pan-y;
    transition:transform .22s cubic-bezier(.16,1,.3,1);
    will-change:transform;
  }
  .item.open .swipe-content{transform:translateX(-168px)}
  .item.dragging .swipe-content{transition:none}
  .check{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    border:1.5px solid #c7c7cc; margin-left:14px;
    display:none; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s;
  }
  body.select-mode .check{display:flex}
  body.select-mode .swipe-content{padding-right:6px}
  .item.sel .check{background:var(--ink); border-color:var(--ink)}
  .item.sel{background:#ececf0}
  .check svg{display:none}
  .item.sel .check svg{display:block}
  .item-content{flex:1; min-width:0; padding:12px 10px 12px 14px; cursor:pointer; display:flex; align-items:center; gap:6px}
  .ic-main{flex:1; min-width:0}
  /* 收藏星标(常驻,点星=收藏;其它区域=复制) */
  .fav-btn{
    flex-shrink:0; width:34px; height:34px; border:none; background:none; cursor:pointer;
    font-size:19px; line-height:1; color:#c7c7cc; padding:0; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .fav-btn:active{background:var(--sel-bg)}
  .fav-btn.on{color:#f4c550; text-shadow:0 1px 2px rgba(200,150,20,.35)}
  .fav-star{color:#f4c550; font-size:13px; margin-right:2px}
  .item-row{display:flex; align-items:center; gap:8px; min-width:0}
  .item-name{font-size:16px; font-weight:650; letter-spacing:-.01em; word-break:break-all}
  .tag{
    flex-shrink:0; font-size:11px; font-weight:600; color:var(--accent-ink);
    background:rgba(217,164,65,.16); border-radius:6px; padding:2px 7px; cursor:pointer;
  }
  .tag.season{color:#fff; background:#3a3a3c}
  .item-code{
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; color:var(--sub);
    margin-top:5px; letter-spacing:-.02em; word-break:break-all;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .empty{text-align:center; color:var(--sub); padding:70px 24px; font-size:15px; line-height:1.8}
  .big{font-size:46px; margin-bottom:12px}
  .big img.empty-badge{
    width:76px; height:76px; display:block; margin:0 auto 6px;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.18));
  }
  /* ---------- 底部:选择操作条 ---------- */
  #select-bar{
    position:fixed; left:50%; transform:translateX(-50%) translateY(16px);
    bottom:calc(env(safe-area-inset-bottom) + 14px); z-index:6;
    width:calc(100% - 32px); max-width:608px;
    background:rgba(28,28,30,.92); -webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%); border-radius:999px;
    padding:7px 8px; display:flex; align-items:center; gap:4px;
    box-shadow:0 10px 34px rgba(0,0,0,.28);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .2s ease, transform .2s cubic-bezier(.16,1,.3,1), visibility 0s linear .2s;
  }
  body.select-mode #select-bar{
    opacity:1; visibility:visible; pointer-events:auto;
    transform:translateX(-50%) translateY(0);
    transition:opacity .2s ease, transform .2s cubic-bezier(.16,1,.3,1), visibility 0s;
  }
  #select-bar .sb-btn{
    flex:1; border:none; background:transparent; color:#fff; font-size:16px;
    font-weight:500; padding:11px 8px; border-radius:999px; cursor:pointer;
  }
  #select-bar .sb-btn:active{background:rgba(255,255,255,.16)}
  #select-bar .sb-btn.danger{color:var(--red); font-weight:600}
  #select-bar .sb-btn.danger:disabled{color:rgba(255,59,48,.35)}
  /* ---------- 底部:常驻 ---------- */
  #fab{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 14px); z-index:5;
    width:calc(100% - 32px); max-width:608px;
    background:var(--ink); color:#fff; border:none; border-radius:999px;
    padding:16px; font-size:17px; font-weight:600; cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  #fab:active{transform:translateX(-50%) scale(.985)}
  body.select-mode #fab{display:none}
  .toolbar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 78px); z-index:4;
    display:flex; gap:16px; font-size:12px;
  }
  body.select-mode .toolbar{display:none}
  .toolbar button{background:none; border:none; color:var(--sub); font-size:13px; cursor:pointer; padding:4px}
  /* ---------- 弹层 ---------- */
  #sheet, #confirm-sheet, #token-sheet{
    position:fixed; inset:0; z-index:10; display:none;
    background:rgba(0,0,0,.35); align-items:flex-end; justify-content:center;
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    transition:opacity .22s ease;
  }
  #sheet.open, #confirm-sheet.open, #token-sheet.open{display:flex}
  /* 关闭动画:容器淡出+面板下滑(240ms 后移除 open);动画期间禁点 */
  #sheet.closing, #confirm-sheet.closing, #token-sheet.closing{opacity:0; pointer-events:none}
  #sheet.closing .panel, #confirm-sheet.closing .panel, #token-sheet.closing .panel{
    transform:translateY(80px); transition:transform .22s ease; pointer-events:none;
  }
  .panel{transition:transform .22s ease}
  .panel{
    width:100%; max-width:640px; background:var(--card);
    border-radius:20px 20px 0 0; padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);
    animation:rise .28s cubic-bezier(.16,1,.3,1);
  }
  @keyframes rise{from{transform:translateY(40px); opacity:.4} to{transform:none; opacity:1}}
  .grab{width:40px; height:5px; border-radius:3px; background:#d1d1d6; margin:0 auto}
  .panel > .grab{margin:6px auto 14px} /* 非拖拽面板(令牌设置等)保持原间距 */
  /* grabber 热区:下拉关闭 */
  .grab-zone{
    display:flex; justify-content:center; padding:9px 0 7px;
    touch-action:none; cursor:grab;
  }
  .panel h2{font-size:18px; font-weight:700; margin-bottom:4px}
  .panel .hint{font-size:13px; color:var(--sub); margin-bottom:12px}
  label{font-size:13px; font-weight:600; color:var(--sub); display:block; margin:12px 0 6px}
  textarea, input[type=text]{
    width:100%; border:none; border-radius:12px; background:#f2f2f7;
    padding:12px 14px; font-size:16px; font-family:inherit; color:var(--ink);
    outline:none; -webkit-appearance:none; appearance:none;
  }
  textarea{min-height:92px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:13px}
  /* 显式粘贴按钮(替代 iOS 自动读,避免系统粘贴条干扰) */
  .paste-btn{
    display:block; width:100%; margin-top:8px; padding:10px; border:none;
    border-radius:12px; background:#f2f2f7; color:var(--ink);
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .paste-btn:active{background:#e5e5ea}
  input:focus, textarea:focus{background:#ececf1; box-shadow:0 0 0 3px rgba(28,28,30,.15)}
  .btn-row{display:flex; gap:10px; margin-top:18px}
  .btn{
    flex:1; padding:15px; border:none; border-radius:14px; font-size:17px;
    font-weight:600; cursor:pointer;
  }
  .btn.primary{background:var(--ink); color:#fff}
  .btn.primary:active{opacity:.85}
  .btn.ghost{background:#f2f2f7; color:var(--ink)}
  .btn.ghost:active{background:#e5e5ea}
  .btn.danger{background:var(--red); color:#fff}
  .btn.danger:active{opacity:.85}
  .btn.danger-outline{background:#f2f2f7; color:var(--red)}
  .btn.danger-outline:active{background:#ffe4e2}
  /* 删除确认(居中卡片, 非底部) */
  #confirm-sheet{align-items:center}
  #confirm-sheet .confirm-card{
    width:min(560px, calc(100% - 56px)); background:#f2f2f7; border-radius:14px;
    overflow:hidden; animation:pop .25s cubic-bezier(.16,1,.3,1);
    text-align:center;
  }
  #confirm-sheet .confirm-card .msg{
    font-size:15px; color:var(--ink); font-weight:600; padding:22px 18px 4px;
  }
  #confirm-sheet .confirm-card .desc{font-size:13px; color:var(--sub); padding:4px 18px 16px}
  #confirm-sheet .confirm-card button{
    display:block; width:100%; border:none; background:var(--card); font-size:17px;
    padding:14px; cursor:pointer; border-top:0.5px solid var(--line);
  }
  #confirm-sheet .confirm-card button.del{color:var(--red); font-weight:600}
  #confirm-sheet .confirm-card button:active{background:#f2f2f2}
  @keyframes pop{from{transform:scale(1.08); opacity:.3} to{transform:none; opacity:1}}
  /* toast */
  #toast{
    position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 18px); transform:translateX(-50%) translateY(-8px);
    background:rgba(28,28,30,.9); color:#fff; padding:9px 18px; border-radius:999px;
    font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:.22s; z-index:20;
    max-width:82%; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){
    .panel, #confirm-sheet .confirm-card{animation:none}
  }
</style>
</head>
<body>
<header>
  <img src="emblem-64.png" alt="金铲铲之战" width="32" height="32">
  <h1>阵容码盒</h1>
  <span id="count"></span>
  <div id="header-right">
    <button class="text-btn" id="sync-btn" title="云端同步状态,点按手动同步"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button class="text-btn" id="select-btn" hidden>选择</button>
  </div>
</header>

<div class="search-wrap">
  <input id="search" type="search" placeholder="搜阵容名 / 标签 / 码…" autocomplete="off">
  <button type="button" id="search-clear" aria-label="清空搜索" hidden>✕</button>
</div>
<div class="chips" id="seasons"></div>
<button class="tag-toggle" id="tag-toggle" hidden><span id="tag-toggle-label">标签筛选</span><span class="tag-arrow">▾</span></button>
<div class="chips" id="tag-chips" hidden></div>

<ul id="list"></ul>
<div id="empty" class="empty" hidden>
  <div class="big">
    <img class="empty-badge" src="emblem-180.png" alt="金铲铲之战" width="76" height="76">
  </div>
  <div id="empty-text">还没有阵容码<br>点下面「存阵容」把好阵容收进来</div>
</div>

<!-- 选择模式底部条 -->
<div id="select-bar">
  <button class="sb-btn" id="sb-selectall">全选</button>
  <button class="sb-btn danger" id="sb-delete" disabled>删除</button>
</div>

<!-- 常态底部 -->
<div class="toolbar" id="toolbar" hidden>
  <button id="btn-export">导出备份</button>
  <button id="btn-import">导入恢复</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
</div>
<button id="fab">＋ 存阵容</button>

<!-- 存阵容表单 -->
<div id="sheet">
  <div class="panel" onclick="event.stopPropagation()">
    <div class="grab-zone" id="sheet-grab"><div class="grab"></div></div>
    <h2 id="sheet-title">存阵容</h2>
    <p class="hint" id="sheet-hint">从公众号 / B站简介复制后直接粘贴，自动提取阵容码和名字</p>
    <label for="raw">粘贴内容</label>
    <textarea id="raw" placeholder="长按粘贴…&#10;例：【福星临门】h5dySUPLXQxxxx…&#10;或纯阵容码"></textarea>
    <button type="button" class="paste-btn" id="btn-paste">📋 从剪贴板粘贴</button>
    <label for="name">阵容名</label>
    <input type="text" id="name" placeholder="如：天将九五" autocomplete="off">
    <label for="tag">标签（可空）</label>
    <input type="text" id="tag" placeholder="如：追三星 / 上分" autocomplete="off">
    <label for="season">赛季</label>
    <input type="text" id="season" list="season-suggest" placeholder="如：S18" autocomplete="off">
    <datalist id="season-suggest"></datalist>
    <div class="btn-row">
      <button class="btn ghost" id="btn-cancel">取消</button>
      <button class="btn primary" id="btn-save">保存</button>
    </div>
  </div>
</div>

<!-- 删除确认 -->
<div id="confirm-sheet">
  <div class="confirm-card" onclick="event.stopPropagation()">
    <div class="msg" id="confirm-msg">删除阵容？</div>
    <div class="desc" id="confirm-desc">删除后无法恢复</div>
    <button id="cf-cancel">取消</button>
    <button class="del" id="cf-ok">删除</button>
  </div>
</div>

<!-- 云同步令牌设置 -->
<div id="token-sheet">
  <div class="panel" onclick="event.stopPropagation()">
    <div class="grab"></div>
    <h2>☁️ 云同步设置</h2>
    <p class="hint" style="margin-bottom:0">令牌<strong>只保存在本机浏览器</strong>，用于读写你的私有数据仓（comp-box-data）。获取方式：GitHub → Settings → Developer settings → Fine-grained tokens → 新建（仅授权 comp-box-data 仓，Contents 读写权限）。</p>
    <label for="cc-token-input">同步令牌</label>
    <input type="text" id="cc-token-input" placeholder="github_pat_…" autocomplete="off" spellcheck="false" style="font-size:13px">
    <div class="btn-row">
      <button class="btn ghost" id="btn-token-clear" style="flex:.7">断开</button>
      <button class="btn primary" id="btn-token-save">保存并同步</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
"use strict";
var KEY="jccCompCodes.v1", FILTER_KEY="jccCompCodes.seasonFilter", TAG_FILTER_KEY="jccCompCodes.tagFilter", LAST_SEASON_KEY="jccCompCodes.lastSeason";
var DEFAULT_SEASON="S18"; // 当前赛季,换季改这里
var list=[], q="", seasonFilter=null, tagFilter=null; // null=全部
var selecting=false, selected={}, tagExpanded=false, editingId=null;

/* ---------- 纯函数:粘贴解析（node 可测） ---------- */
// 金铲铲/云顶阵容码:【阵容码】开头的长字母数字串(hex/base64,可能被中文/括号裹着)。挑最长 alnum 串当码,余文当名字。
function extract(text){
  text=(text||"").trim();
  if(!text) return {code:"",name:"",rest:text};
  var code="", rest=[];
  text.split(/\s+/).forEach(function(t){
    var m=t.match(/[A-Za-z0-9+/=]{12,}/); // 码子串,容忍【阵容码】/中文前缀直接粘连
    if(m&&m[0].length>=code.length&&code.length>0){ return; } // 与已认码同长的串(重复粘贴)丢弃
    if(m&&m[0].length>code.length){ code=m[0]; return; }
    rest.push(t);
  });
  var name=rest.join(" ").trim();
  if(!name&&code){ // 整段单 token:码被名字文字裹着,剥离码取剩余中文
    var leftover=text.split(code).join("").replace(/[【】\[\]《》()（）]/g," ");
    name=leftover;
  }
  name=name.replace(/(阵容码|分享码|代码|阵容代码)\s*[:：]?\s*/g," ")
           .replace(/^[【\[《("'“\s.,;:!?。，；：！？、-]+|[】\]》)"'”\s.,;:!?。，；：！？、-]+$/g,"")
           .replace(/\s+/g," ")
           .trim().slice(0,40);
  return {code:code, name:name, rest:rest.join(" ").trim()};
}
function makeItem(code,name,tag,season,ts){
  return {id:(ts||Date.now())+"-"+Math.random().toString(36).slice(2,7), code:code, name:name||"(未命名)", tag:tag||"", season:season||DEFAULT_SEASON, ts:ts||Date.now()};
}

/* ---------- 存储 ---------- */
function load(){
  try{ list=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ list=[]; }
  if(!Array.isArray(list)) list=[];
  var changed=false;
  list.forEach(function(it){ if(!it.season){ it.season=DEFAULT_SEASON; changed=true; } }); // 旧数据归当前赛季
  if(changed) save();
  try{ seasonFilter=localStorage.getItem(FILTER_KEY)||null; }catch(e){}
  try{ tagFilter=localStorage.getItem(TAG_FILTER_KEY)||null; }catch(e){}
}
function save(){ localStorage.setItem(KEY, JSON.stringify(list)); }

/* ---------- 渲染 ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
var CHECK_SVG='<svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L5.5 10.5L11.5 3.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function tagHtml(t){ return t? '<span class="tag">'+esc(t)+'</span>' : ''; }
function seasonHtml(s){ return s? '<span class="tag season">'+esc(s)+'</span>' : ''; }
function refreshSeasonChips(){
  var seasons=[], seen={};
  list.forEach(function(it){ var s=it.season||DEFAULT_SEASON; if(!seen[s]){ seen[s]=1; seasons.push(s); } });
  if(seasonFilter&&seasons.indexOf(seasonFilter)<0){ seasonFilter=null; try{localStorage.removeItem(FILTER_KEY);}catch(e){} }
  seasons.sort().reverse();
  var chips=[{v:null,t:"全部"}].concat(seasons.map(function(s){return {v:s,t:s};}));
  document.getElementById("seasons").innerHTML=chips.map(function(c){
    return '<button class="chip'+(seasonFilter===c.v?" on":"")+'" data-season="'+esc(c.v===null?"__ALL__":c.v)+'">'+esc(c.t)+'</button>';
  }).join("");
}
function refreshTagChips(){
  var tags=[], seen={};
  list.forEach(function(it){ var t=(it.tag||"").trim(); if(t&&!seen[t]){ seen[t]=1; tags.push(t); } });
  tags.sort();
  var box=document.getElementById("tag-chips");
  var tgl=document.getElementById("tag-toggle");
  tgl.hidden=!tags.length;
  var openState=tagExpanded||!!tagFilter;         // 有激活标签时保持展开可见
  box.hidden=!tags.length||!openState;
  tgl.classList.toggle("open", openState);
  tgl.classList.toggle("on", !!tagFilter);
  document.getElementById("tag-toggle-label").textContent=tagFilter? "标签 · "+tagFilter : "标签筛选";
  if(tagFilter&&tags.indexOf(tagFilter)<0){ tagFilter=null; try{localStorage.removeItem(TAG_FILTER_KEY);}catch(e){} }
  var chips=[{v:"__NONE__",t:"全部标签"}].concat(tags.map(function(s){return {v:s,t:s};}));
  box.innerHTML=chips.map(function(c){
    return '<button class="chip tag-chip'+(tagFilter===null&&c.v==="__NONE__"||tagFilter===c.v?" on":"")+'" data-tag="'+esc(c.v)+'">'+esc(c.t)+'</button>';
  }).join("");
}
function visibleRows(){
  var k=(q||"").toLowerCase();
  return list.filter(function(it){
    if(seasonFilter&&it.season!==seasonFilter) return false;
    if(tagFilter&&(it.tag||"")!==tagFilter) return false;
    if(!k) return true;
    return (it.name+" "+it.tag+" "+it.season+" "+it.code).toLowerCase().indexOf(k)>-1;
  }).sort(function(a,b){
    var fa=a.fav?1:0, fb=b.fav?1:0;
    if(fa!==fb) return fb-fa;                 // 收藏置顶
    return (b.ts||0)-(a.ts||0);
  });
}
function activeFilters(){
  var parts=[];
  if(q) parts.push("“"+q+"”");
  if(seasonFilter) parts.push(seasonFilter);
  if(tagFilter) parts.push("标签 "+tagFilter);
  return parts.join(" + ");
}
function updateSelectUI(){
  var n=list.length, sn=Object.keys(selected).length;
  document.getElementById("count").textContent=selecting?
    (sn? "已选 "+sn+" 项" : "选择阵容") :
    (n? n+" 套"+(seasonFilter? " · "+seasonFilter:"")+(tagFilter? " · "+tagFilter:"")+(q&&visibleRows().length!==n?" · 命中 "+visibleRows().length:""):"");
  document.getElementById("sb-delete").textContent=sn? "删除("+sn+")" : "删除";
  document.getElementById("sb-delete").disabled=!sn;

    (visible&&Object.keys(selected).length===visible)&&visible>0 ? "取消全选" : "全选";
  document.getElementById("empty-text").innerHTML=list.length?
    "没有匹配「"+esc(activeFilters()||"当前条件")+"」的阵容" :
    "还没有阵容码<br>点下面「存阵容」把好阵容收进来";
}
function render(){
  var rows=visibleRows();
  refreshSeasonChips();
  refreshTagChips();
  var ul=document.getElementById("list");

    var sel=selected[it.id]?true:false;

      '<div class="swipe-bg"><button class="swipe-edit" type="button">编辑</button><button class="swipe-del" type="button">删除</button></div>'+
      '<div class="swipe-content">'+
        '<span class="check">'+CHECK_SVG+'</span>'+
        '<div class="item-content">'+
          '<div class="ic-main">'+
            '<div class="item-row">'+(it.fav?'<span class="fav-star">★</span>':'')+seasonHtml(it.season)+'<span class="item-name">'+esc(it.name)+'</span>'+tagHtml(it.tag)+'</div>'+
            '<div class="item-code">'+esc(it.code)+'</div>'+

  var empty=document.getElementById("empty");

/* ---------- 删除确认(单条滑动删除 与 选择模式批量删除 共用) ---------- */
var pendingDeleteIds=null;
function requestDelete(ids){
  if(!ids||!ids.length) return;
  pendingDeleteIds=ids;
  var msg;
  if(ids.length===list.length){
    msg="删除 全部阵容？";
  }else if(ids.length===1){
    var it=null;
    for(var i=0;i<list.length;i++) if(list[i].id===ids[0]) it=list[i];
    msg="删除「"+(it? it.name : "该阵容")+"」？";
  }else{
    msg="删除 "+ids.length+" 套阵容？";
  }
  document.getElementById("confirm-msg").textContent=msg;
  document.getElementById("confirm-desc").textContent="删除后无法恢复";
  var cs=document.getElementById("confirm-sheet");
  cancelDismiss(cs);
  cs.classList.add("open");
}
function confirmDelete(){
  if(!pendingDeleteIds) return;
  var n=pendingDeleteIds.length;
  list=list.filter(function(it){ return pendingDeleteIds.indexOf(it.id)<0; });
  for(var i=0;i<pendingDeleteIds.length;i++) if(tombstones.indexOf(pendingDeleteIds[i])<0) tombstones.push(pendingDeleteIds[i]);
  pendingDeleteIds=null; selected={};
  save(); rememberTombstones(); toast("已删除 "+n+" 套");
  if(!list.length) exitSelect(); else render();
  closeConfirm();
  if(cloudOn()) syncPush();                         // 墓碑随本次推送一并剔除云端
}
var dismissTimers={};
function cancelDismiss(el){ clearTimeout(dismissTimers[el.id]); el.classList.remove("closing"); }
function dismiss(el){
  cancelDismiss(el);
  el.classList.add("closing");                    // 淡出+下滑(仍 display flex)
  dismissTimers[el.id]=setTimeout(function(){
    el.classList.remove("closing"); el.classList.remove("open");
    delete dismissTimers[el.id];
  }, 240);
}
function closeConfirm(){ dismiss(document.getElementById("confirm-sheet")); }

/* ---------- 动作 ---------- */
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove("show");},1600);
}
function copyText(s){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(s).then(function(){return true;},function(){return false;});
  }
  var ta=document.createElement("textarea");
  ta.value=s; ta.style.cssText="position:fixed;opacity:0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  return Promise.resolve(true);
}
function lastSeason(){
  try{ return localStorage.getItem(LAST_SEASON_KEY)||DEFAULT_SEASON; }catch(e){ return DEFAULT_SEASON; }
}
function refreshSeasonSuggest(){
  var opts=[], seen={}, box=document.getElementById("season-suggest");
  list.forEach(function(it){ var s=it.season; if(s&&!seen[s]){seen[s]=1; opts.push(s);} });
  [DEFAULT_SEASON, "S19","S17"].forEach(function(s){ if(!seen[s]){seen[s]=1; opts.push(s);} });
  box.innerHTML=opts.map(function(s){ return '<option value="'+esc(s)+'">'; }).join("");

  if(!it) return;
  it.fav=!it.fav;

function openSheet(item){
  editingId=item? item.id : null;
  document.getElementById("raw").value=item? (item.code||"") : "";
  document.getElementById("name").value=item? (item.name||"") : "";
  document.getElementById("tag").value=item? (item.tag||"") : "";

  refreshSeasonSuggest();
  document.getElementById("sheet-title").textContent=item? "编辑阵容" : "存阵容";
  document.getElementById("sheet-hint").textContent=item? "修改后点保存（阵容码也可改）" : "从公众号 / B站简介复制后直接粘贴，自动提取阵容码和名字";
  var sh=document.getElementById("sheet");
  cancelDismiss(sh);
  sh.classList.add("open");
  // 不自动读剪贴板(避免 iOS 系统粘贴条/权限浮层干扰表单),由用户点「从剪贴板粘贴」触发
}
function pasteFromClipboard(){
  if(!navigator.clipboard||!navigator.clipboard.readText){ toast("当前浏览器不支持读取剪贴板"); return; }
  navigator.clipboard.readText().then(function(t){
    if(!document.getElementById("sheet").classList.contains("open")) return; // 已关闭则弃
    t=(t||"").trim();
    if(!t){ toast("剪贴板是空的"); return; }
    var ta=document.getElementById("raw");
    var r=extract(t);
    ta.value=t;
    var nm=document.getElementById("name");
    if(r.code){
      if(!nm.dataset.touched&&!nm.value) nm.value=r.name;
      toast("已粘贴，识别出阵容码");
    }else{
      toast("已粘贴，但没认出阵容码，可修改");
    }
  },function(){ toast("读取被拒，可长按输入框系统粘贴"); });
}
function closeSheet(){ dismiss(document.getElementById("sheet")); }

/* ---------- 表单下拉关闭(iOS sheet 手势) ---------- */
(function(){
  var sheet=document.getElementById("sheet");
  var panel=sheet.querySelector(".panel");
  var grab=document.getElementById("sheet-grab");
  var drag=null;
  grab.addEventListener("pointerdown",function(ev){
    drag={y0:ev.clientY, dy:0, moved:false};
    try{ grab.setPointerCapture(ev.pointerId); }catch(e){}
  });
  grab.addEventListener("pointermove",function(ev){
    if(!drag) return;
    var dy=ev.clientY-drag.y0;
    if(!drag.moved&&Math.abs(dy)<6) return;
    drag.moved=true; drag.dy=dy;
    panel.style.transition="none";
    panel.style.transform= dy>0? "translateY("+Math.min(dy*0.55,280)+"px)" : "";
  });
  function endDrag(){
    if(!drag) return;
    var d=drag; drag=null;
    if(d.moved&&d.dy>110){
      panel.style.transition="transform .22s cubic-bezier(.16,1,.3,1)";
      panel.style.transform="translateY(110%)";
      setTimeout(function(){
        closeSheet();
        panel.style.transition=""; panel.style.transform="";
      },220);
    }else{
      panel.style.transition="transform .22s cubic-bezier(.16,1,.3,1)";
      panel.style.transform="";
    }
  }
  grab.addEventListener("pointerup",endDrag);
  grab.addEventListener("pointercancel",function(){ drag=null; panel.style.transition=""; panel.style.transform=""; });
  // 注:不做"点击横线关闭"(用户指定),仅下拉手势收起
})();

/* ---------- 左滑删除(常态;选择模式下滑动禁用) ---------- */
var SWIPE_W=168, drag=null, suppressClickUntil=0;
function closeSwipes(excludeLi){
  var o=document.querySelectorAll("li.item.open");
  for(var i=0;i<o.length;i++) if(!excludeLi||o[i]!==excludeLi) o[i].classList.remove("open");
}
function openSwipe(li){ closeSwipes(li); li.classList.add("open"); }
document.getElementById("list").addEventListener("pointerdown",function(ev){
  if(selecting) return;                       // 选择模式禁用滑动
  var li=ev.target.closest("li.item");
  if(!li) return;                             // 整行可起手(含露出的删除红区),便于右滑收回
  drag={li:li, x0:ev.clientX, y0:ev.clientY, base:li.classList.contains("open")?-SWIPE_W:0, dx:0, moved:false};
  li.classList.add("dragging");
  try{ ev.target.setPointerCapture(ev.pointerId); }catch(e){}
});
document.getElementById("list").addEventListener("pointermove",function(ev){
  if(!drag) return;
  var dx=ev.clientX-drag.x0, dy=Math.abs(ev.clientY-drag.y0);
  if(!drag.moved){
    if(Math.abs(dx)<6&&dy<8) return;         // 未过阈值,可能是点击
    if(dy>Math.abs(dx)){                      // 纵向主导:交给滚动
      endDrag(true); return;
    }
    drag.moved=true;
  }
  drag.dx=dx;
  var x=Math.max(-SWIPE_W, Math.min(0, drag.base+dx));
  drag.li.querySelector(".swipe-content").style.transform="translateX("+x+"px)";
});
function endDrag(cancel){
  if(!drag) return;
  var li=drag.li, sc=li.querySelector(".swipe-content");
  var moved=drag.moved;
  if(sc) sc.style.transform="";
  li.classList.remove("dragging");
  if(!cancel){
    var x=drag.base+drag.dx;
    if(x<=-SWIPE_W*0.5) openSwipe(li); else closeSwipes(); // 关闭全部(含自身)
  }else{
    closeSwipes();
  }
  drag=null;
  if(moved) suppressClickUntil=Date.now()+350; // 拖动结束抑制随后的合成 click
}
document.getElementById("list").addEventListener("pointerup",function(){ endDrag(false); });
document.getElementById("list").addEventListener("pointercancel",function(){ endDrag(true); });
document.getElementById("list").addEventListener("click",function(ev){
  if(Date.now()<suppressClickUntil){ suppressClickUntil=0; return; } // 刚拖完的合成 click
  var li=ev.target.closest("li.item"); if(!li) return;
  var id=li.dataset.id;
  var editBtn=ev.target.closest(".swipe-edit");
  if(editBtn){                                   // 滑动露出的编辑
    var eit=null;
    for(var i=0;i<list.length;i++) if(list[i].id===id) eit=list[i];
    if(eit){ closeSwipes(); openSheet(eit); }
    return;
  }
  var delBtn=ev.target.closest(".swipe-del");
  if(delBtn){ requestDelete([id]); return; }  // 滑动露出的删除
  if(selecting){ toggleSelect(id); return; }  // 选择模式:点任意处(含收藏星)=切换选中
  var favBtn=ev.target.closest(".fav-btn");
  if(favBtn){ toggleFav(id); return; }         // 常态:点星=收藏/取消(不影响复制)
  if(li.classList.contains("open")){ closeSwipes(); return; } // 点已滑开的行:先收回,不复制
  // 点卡片上的徽章直接筛选(点中=筛该值,再点=取消)
  var tagEl=ev.target.closest(".tag:not(.season)");
  if(tagEl){
    var tv=tagEl.textContent;
    tagFilter=(tagFilter===tv)? null : tv;
    try{ tagFilter? localStorage.setItem(TAG_FILTER_KEY,tagFilter) : localStorage.removeItem(TAG_FILTER_KEY); }catch(e){}
    render(); return;
  }
  var seaEl=ev.target.closest(".tag.season");
  if(seaEl){
    var sv=seaEl.textContent;
    seasonFilter=(seasonFilter===sv)? null : sv;
    try{ seasonFilter? localStorage.setItem(FILTER_KEY,seasonFilter) : localStorage.removeItem(FILTER_KEY); }catch(e){}
    render(); return;
  }
  if(!ev.target.closest(".item-content")) return;
  var it=list.filter(function(x){return x.id===id;})[0];
  if(!it) return;
  copyText(it.code).then(function(ok){ toast(ok? "已复制 · "+it.name : "复制失败，请重试"); });
});

/* ---------- 云同步(GitHub Contents API) ----------
   权威数据存私有仓 comp-box-data/data.json;localStorage 是离线缓存。
   sha 条件写入防并发;409 冲突→重拉按 ts 合并;删除靠本地墓碑剔除传播。
   token 只存本机 localStorage(不进代码仓,防公开泄露),在顶栏同步按钮设置。 */
var CLOUD={
  repo:"faukwaa/comp-box-data", file:"data.json",
  apiBase:(function(){ try{ return localStorage.getItem("ccApiBase")||"https://api.github.com/repos/"; }catch(e){ return "https://api.github.com/repos/"; } })(),
  token:(function(){ try{ return localStorage.getItem("ccToken")||""; }catch(e){ return ""; } })(),
  sha:null, state:"off"
};
var SYNCS_KEY="jccCompCodes.sync";
var tombstones=[];
function cloudOn(){ return CLOUD.token.length>20; }
function b64encode(str){
  var bytes=new TextEncoder().encode(str), bin="";
  for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64){
  var bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function loadSyncMeta(){
  try{
    var s=JSON.parse(localStorage.getItem(SYNCS_KEY)||"null");
    if(s){ CLOUD.sha=s.sha||null; tombstones=(s.tomb||[]).slice(); }
  }catch(e){}
}
function saveSyncMeta(){
  try{ localStorage.setItem(SYNCS_KEY, JSON.stringify({sha:CLOUD.sha, tomb:tombstones, at:Date.now()})); }catch(e){}
}
function ghReq(method, bodyObj){
  var ctrl=(typeof AbortController!=="undefined")? new AbortController() : null;
  var to=ctrl? setTimeout(function(){ ctrl.abort(); }, 15000) : null;   // 网络兜底,绝不无限挂起
  return fetch(CLOUD.apiBase+CLOUD.repo+"/contents/"+CLOUD.file, {
    method:method,
    headers:{ "Authorization":"Bearer "+CLOUD.token, "Accept":"application/vnd.github+json" },
    body: bodyObj? JSON.stringify(bodyObj) : undefined,
    signal: ctrl? ctrl.signal : undefined
  }).then(function(r){ if(to) clearTimeout(to); return r; },
          function(e){ if(to) clearTimeout(to); throw e; });
}
async function cloudGet(){
  var r=await ghReq("GET");
  if(r.status===404) return null;                 // 云端还没有文件
  if(!r.ok) throw new Error("cloud GET "+r.status);
  var d=await r.json();
  var doc=JSON.parse(b64decode(d.content)||"{}");
  return {sha:d.sha, items:Array.isArray(doc.items)? doc.items: []};
}
async function cloudPut(items){
  var body={ message:"sync "+new Date().toISOString().slice(0,16),
             content:b64encode(JSON.stringify({v:1, items:items})) };
  if(CLOUD.sha) body.sha=CLOUD.sha;
  var r=await ghReq("PUT", body);
  if(r.status===409){ var e=new Error("conflict"); e.conflict=true; throw e; }
  if(!r.ok) throw new Error("cloud PUT "+r.status);
  var d=await r.json();
  CLOUD.sha=d.content.sha;                        // 记新 sha,后续条件写入
  saveSyncMeta();
}
// 合并:同 id 取 ts 较新者;云端被本端墓碑剔除;本地独有=新增上传;云端独有=下载
function mergeByTs(cloudItems, localItems){
  var map={};
  cloudItems.concat(localItems).forEach(function(it){
    var ex=map[it.id];
    if(!ex||(it.ts||0)>(ex.ts||0)) map[it.id]=it;
  });
  var out=[];
  Object.keys(map).forEach(function(id){
    if(tombstones.indexOf(id)<0) out.push(map[id]);
  });
  return out;
}
function setSyncUI(mode, label){
  var b=document.getElementById("sync-btn");
  b.className="text-btn "+mode;
  if(label) b.title=label;
}
async function syncPush(){                          // 本地改动 → 云端
  if(!cloudOn()) return;
  setSyncUI("syncing","同步中…");
  try{
    await cloudPut(list);
    CLOUD.state="ok"; tombstones=[]; saveSyncMeta();
    setSyncUI("ok","已同步 "+(new Date()).toLocaleTimeString());
  }catch(e){
    if(e.conflict){                                 // sha 过期:重拉合并后再推
      try{
        var g=await cloudGet();
        if(!g){ await cloudPut(list); }
        else{
          var merged=mergeByTs(g.items, list);
          list=merged; save(); render();
          CLOUD.sha=g.sha; saveSyncMeta();
          await cloudPut(merged);
        }
        CLOUD.state="ok"; tombstones=[]; saveSyncMeta();
        setSyncUI("ok","已同步");
        return;
      }catch(e2){ CLOUD.state="err"; setSyncUI("err","冲突合并失败"); if(window.console) console.error("merge fail", e2); }
    }
    CLOUD.state="err"; setSyncUI("err","离线:改动已存本机,联网后自动同步");
  }
}
async function syncPull(){                          // 云端 → 本地(启动/手动)
  if(!cloudOn()) return;
  setSyncUI("syncing","同步中…");
  try{
    var g=await cloudGet();
    if(g){
      var merged=mergeByTs(g.items, list);
      var changed=JSON.stringify(merged)!==JSON.stringify(list);
      list=merged; save(); render();
      CLOUD.sha=g.sha; saveSyncMeta();             // 先对齐云端 sha 再写
      if(changed){ await cloudPut(merged); }        // 本端新增/删除一并上云
      CLOUD.state="ok"; tombstones=[]; saveSyncMeta();
      setSyncUI("ok","已同步 "+(new Date()).toLocaleTimeString());
    }
  }catch(e){
    CLOUD.state="err"; setSyncUI("err","同步失败,稍后重试");
  }
}
function rememberTombstones(){                      // 删除记账(离线也能传播删除)
  saveSyncMeta();
}
function openTokenSheet(){
  document.getElementById("cc-token-input").value=CLOUD.token;
  var s=document.getElementById("token-sheet");
  cancelDismiss(s);
  s.classList.add("open");
}
function closeTokenSheet(){ dismiss(document.getElementById("token-sheet")); }
function saveToken(){
  var t=document.getElementById("cc-token-input").value.trim();
  if(!t){ toast("令牌不能为空"); return; }
  try{ localStorage.setItem("ccToken", t); }catch(e){ toast("保存失败"); return; }
  toast("已保存,正在同步…"); closeTokenSheet();
  setTimeout(function(){ location.reload(); }, 400);
}
function clearToken(){
  try{ localStorage.removeItem("ccToken"); }catch(e){}
  toast("已断开云同步"); closeTokenSheet();
  setTimeout(function(){ location.reload(); }, 400);
}
document.getElementById("sync-btn").addEventListener("click",function(){ cloudOn()? syncPull() : openTokenSheet(); });
document.getElementById("btn-token-save").addEventListener("click",saveToken);
document.getElementById("btn-token-clear").addEventListener("click",clearToken);
document.getElementById("token-sheet").addEventListener("click",closeTokenSheet);

/* ---------- init ---------- */
load(); render();
if(cloudOn()){
  loadSyncMeta();
  document.getElementById("sync-btn").className="text-btn syncing";
  syncPull();                                       // 启动自动拉取合并
}else{
  document.getElementById("sync-btn").title="未配置云同步,点按设置";
}
window.__extract=extract; // 供 node 单测
})();
</script>
</body>
